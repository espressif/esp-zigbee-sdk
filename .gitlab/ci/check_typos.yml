check_typos:
  image: ${CI_REGISTRY}/ci/images/idf-${DOCKER_ENV_FOR_GENERATE}
  stage: pre_build
  script:
    - pip install codespell
    - git fetch origin main
    - |
      FILES=$(git diff --name-only --diff-filter=d origin/main...HEAD)
      echo "change files: $FILES"
      if [ -n "$FILES" ]; then
        ./tools/check_typos.sh $FILES
      fi
  tags:
    - build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
      when: never
    - when: on_success
